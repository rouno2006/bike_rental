{% extends 'rental/base.html' %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4 shadow-sm border-0 rounded-4">
                <h4 class="fw-bold text-center mb-4">Sign In</h4>
                <form method="POST">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ request.GET.next }}">
                    {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">{{ field.label }}</label>
                        {{ field }}
                    </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-dark w-100 py-2 mt-3">Login</button>
                </form>
                <div class="text-center mt-3 small">
                    New user? <a href="{% url 'register' %}" class="text-decoration-none">Create an account</a>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    document.querySelectorAll('input').forEach(el => el.classList.add('form-control'));
</script>
{% endblock %}
