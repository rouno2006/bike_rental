{% extends 'rental/base.html' %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4 shadow-sm border-0 rounded-4">
                <h4 class="fw-bold text-center mb-4">Register</h4>
                <form method="POST">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small mt-1">{{ field.errors }}</div>
                        {% endif %}
                    </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-warning w-100 fw-bold py-2 mt-3">Sign Up</button>
                </form>
                <div class="text-center mt-3 small">
                    Already have an account? <a href="{% url 'login' %}" class="text-decoration-none">Login here</a>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    document.querySelectorAll('input').forEach(el => el.classList.add('form-control'));
</script>
{% endblock %}
