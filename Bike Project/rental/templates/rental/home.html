{% extends 'rental/base.html' %} 

{% block content %}
<style>
    .hero-section {
        /* ADD PICTURE ON COVER */
        background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('https://images.unsplash.com/photo-1558981403-c5f9899a28bc?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
        background-size: cover;
        background-position: center;
        height: 85vh; /* Screen size*/
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        text-align: center;
        margin-top: -24px; 
    }
    .hero-title {
        font-size: 4rem;
        font-weight: 700;
        margin-bottom: 20px;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }
    .hero-subtitle {
        font-size: 1.2rem;
        font-weight: 300;
        margin-bottom: 40px;
        color: #e0e0e0;
    }
    .btn-custom-primary {
        background-color: #a0b1e9;
        color: #070707;
        font-weight: bold;
        border: none;
        padding: 12px 35px;
        border-radius: 5px;
        transition: 0.3s;
    }
    .btn-custom-primary:hover {
        background-color: #ffffff;
        color: #000;
        transform: translateY(-2px);
    }
    .btn-custom-outline {
        background-color: transparent;
        color: #fff;
        border: 2px solid #fff;
        font-weight: bold;
        padding: 10px 35px;
        border-radius: 5px;
        transition: 0.3s;
    }
    .btn-custom-outline:hover {
        background-color: #fff;
        color: #000;
        transform: translateY(-2px);
    }
</style>

<div class="hero-section">
    <div class="container">
        <!-- BIG HEADING -->
        <h1 class="hero-title">Ride the City. Feel the Freedom.</h1>
        <!-- SUBTITLE -->
        <p class="hero-subtitle">Affordable, well-maintained bikes for your next adventure. Book in seconds.</p>
        
        <!-- BUTTONS -->
        <div class="mt-4">
            <a href="{% url 'vehicles' %}" class="btn btn-custom-primary btn-lg mx-2 mb-3">
                <i class="fas fa-motorcycle"></i> Book Your Ride
            </a>
            <a href="{% url 'vehicles' %}" class="btn btn-custom-outline btn-lg mx-2 mb-3">
                <i class="fas fa-search"></i> Explore Fleet
            </a>
        </div>
    </div>
</div>
{% endblock %}
